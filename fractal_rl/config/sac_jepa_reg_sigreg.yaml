# SAC+JEPA with sliced-Gaussian latent regularization (SIGReg).
training:
  jepa_coef: 0.025
  critic_jepa_coef: 0.025
  jepa_horizon: 8
  jepa_target_tau: 0.01
  jepa_target_update_transitions: 64
  jepa_inverse_coef: 0.0
  jepa_action_margin_coef: 0.0
  jepa_variance_coef: 0.0
  jepa_regularizer: sigreg
  jepa_regularizer_coef: 0.005
  jepa_regularizer_slices: 64
