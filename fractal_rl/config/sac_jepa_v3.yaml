# V3: boundary-safe eight-step action-conditioned JEPA.
training:
  jepa_coef: 0.025
  jepa_horizon: 8
  # Explicit ablation: no inverse-dynamics or shuffled-action margin terms.
  jepa_inverse_coef: 0.0
  # The diagnostic is still logged, but it has zero optimization weight.
  jepa_action_margin_coef: 0.0
  jepa_action_margin: 0.05
  # Match the actor JEPA scale for the independent critic encoders.
  critic_jepa_coef: 0.025
  jepa_target_tau: 0.01
  jepa_target_update_transitions: 64
  jepa_variance_coef: 0.01
  jepa_variance_target: 0.1
