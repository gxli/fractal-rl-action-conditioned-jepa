# Full-field cached inverted CDD + the SA-JEPA scale-aware ConvNeXt encoder.
terrain:
  cdd_scales: [2, 4, 8, 16]
  cdd_inverted: true
  cdd_use_gpu: true
training:
  jepa_coef: 0.025
  jepa_horizon: 8
  jepa_inverse_coef: 0.025
  jepa_action_margin_coef: 0.025
  jepa_action_margin: 0.05
  critic_jepa_coef: 0.025
  jepa_target_tau: 0.01
  jepa_target_update_transitions: 64
  jepa_variance_coef: 0.01
  jepa_variance_target: 0.1
