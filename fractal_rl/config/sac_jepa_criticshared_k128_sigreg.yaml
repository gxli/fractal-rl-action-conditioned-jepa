# Matched K=128 critic-trained shared JEPA with SIGReg on the actor/JEPA latent.
training:
  encoder_sharing: critic_trained
  jepa_coef: 0.025
  critic_jepa_coef: 0.0
  jepa_horizon: 128
  jepa_inverse_coef: 0.0
  jepa_action_margin_coef: 0.0
  jepa_variance_coef: 0.0
  jepa_regularizer: sigreg
  jepa_regularizer_coef: 0.005
  jepa_regularizer_slices: 64
