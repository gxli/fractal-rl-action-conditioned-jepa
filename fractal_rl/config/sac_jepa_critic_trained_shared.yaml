# One critic-trained encoder: TD loss updates the shared backbone; policy/JEPA
# heads consume detached features, preventing actor gradients from changing it.
training:
  encoder_sharing: critic_trained
  jepa_coef: 0.025
  critic_jepa_coef: 0.0
  jepa_horizon: 8
  jepa_target_tau: 0.01
  jepa_target_update_transitions: 64
  jepa_inverse_coef: 0.0
  jepa_action_margin_coef: 0.0
  jepa_variance_coef: 0.0
  jepa_regularizer_coef: 0.0
